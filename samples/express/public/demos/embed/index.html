<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpeakUp | 職場壓力對話演練</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="/">SpeakUp</a>
      <span id="avatar-status">主管載入中</span>
    </header>

    <main class="experience">
      <section class="stage" aria-label="虛擬主管">
        <sv-presenter></sv-presenter>
        <div id="stage-loading" class="stage-loading"><span></span><span></span><span></span></div>
        <div id="stage-error" class="stage-error" hidden></div>
      </section>

      <p id="avatar-cue" class="avatar-cue" aria-live="polite">主管狀態：待命</p>

      <aside class="control-panel" aria-label="情境選擇">
        <p class="control-title">選擇演練情境</p>
        <div class="scenario-buttons">
          <button class="scenario-choice is-active" type="button" data-scenario="overtime" aria-pressed="true">臨時加班</button>
          <button class="scenario-choice" type="button" data-scenario="deadline" aria-pressed="false">不合理 Deadline</button>
          <button class="scenario-choice" type="button" data-scenario="risky_release" aria-pressed="false">跳過測試 Release</button>
        </div>
        <p id="conversation-status" class="conversation-status">選擇情境後開始對話。</p>
      </aside>

      <section id="chat" class="chat" hidden aria-label="對話">
        <ul id="chat-log" class="chat-log"></ul>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" class="chat-input" aria-label="輸入回覆" placeholder="輸入你的回覆…" disabled />
          <button id="send-btn" class="send-btn" type="submit" disabled>送出</button>
        </form>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
